      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 140px 140px 1fr 1fr;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .date-badge {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .ganzhi {
      color: var(--text-muted);
      font-size: 13px;
      margin-left: 6px;
    }
    .tag {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }
    .tag-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef444433; }
    .tag-orange { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid #f9731633; }
    .tag-yellow { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab30833; }
    .tag-green { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e33; }

      font-size: 13px;
      line-height: 1.5;
    }
    .label {
      font-weight: bold;
      margin-right: 4px;
    }
    .label-yi { color: #4ade80; }
    .label-ji { color: #f87171; }

    function getTagClass(type) {
      if (type.includes("🔴")) return "tag-red";
      if (type.includes("🟠")) return "tag-orange";
      if (type.includes("🟡")) return "tag-yellow";
      return "tag-green";
    }

    function renderList(list) {
      const container = document.getElementById("cardContainer");
      container.innerHTML = list.map(item => `
        <div class="card">
          <div>
            <span class="date-badge">${item.date.slice(5)}</span>
            <span class="ganzhi">${item.gz}</span>
          </div>
          <div>
            <span class="tag ${getTagClass(item.type)}">${item.type}</span>
          </div>
          <div class="action-col">
            <span class="label label-yi">【宜】</span>${item.yi}
          </div>
          <div class="action-col">
            <span class="label label-ji">【忌】</span>${item.ji}
          </div>
        </div>
      `).join("");
    }

    function filterTag(filter) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (filter === 'ALL') {
        renderList(strategyList);
      } else {
        const filtered = strategyList.filter(item => item.type.includes(filter));
        renderList(filtered);
      }
    }

    // 初始化渲染全部
    renderList(strategyList);
