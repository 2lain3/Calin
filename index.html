<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人財務與日程管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- 頂部導航 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                    <i class="fa-solid fa-wallet mr-1 text-blue-600"></i> MyFinance
                </span>
                <span id="cloudSyncStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">
                    <i id="cloudSyncIcon" class="fa-solid fa-cloud mr-1"></i> <span id="cloudSyncText">待命</span>
                </span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btnSyncCloud" onclick="syncWithCloud()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-lg transition" title="從 Google Sheet 同步">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="openSettingsModal()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-lg transition" title="預算與支付設定">
                    <i class="fa-solid fa-sliders"></i>
                </button>
                <button onclick="openBackupModal()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-lg transition" title="本地備份">
                    <i class="fa-solid fa-database"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 年月切換 -->
        <div class="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm border border-slate-200/80">
            <button onclick="changeMonth(-1)" class="p-2 w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="text-center">
                <h2 id="currentMonthYearText" class="text-lg font-bold text-slate-800">載入中...</h2>
            </div>
            <button onclick="changeMonth(1)" class="p-2 w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- 財務統計總覽 -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">當月總收入</span>
                <span id="statTotalIncome" class="text-lg font-bold text-emerald-600">HK$ 0.00</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">當月總支出</span>
                <span id="statTotalExpense" class="text-lg font-bold text-rose-600">HK$ 0.00</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">當月結餘</span>
                <span id="statNetBalance" class="text-lg font-bold text-slate-800">HK$ 0.00</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 block mb-1">當月總預算上限</span>
                <span id="statTotalBudget" class="text-lg font-bold text-blue-600">HK$ 0.00</span>
            </div>
        </section>

        <!-- 雙欄進度分析：類別預算 vs 支付方式支出 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 類別預算追蹤 -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-chart-pie mr-2 text-indigo-500"></i> 當月類別預算追蹤
                    </h3>
                    <button onclick="openSettingsModal()" class="text-xs text-blue-600 hover:underline">調整預算</button>
                </div>
                <div id="budgetProgressList" class="space-y-3">
                    <p class="text-sm text-slate-400 text-center py-4">尚未設定預算或無支出資料</p>
                </div>
            </section>

            <!-- 支付方式 / 賬戶支出佔比 -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-credit-card mr-2 text-blue-500"></i> 支付方式支出分佈
                    </h3>
                    <button onclick="openSettingsModal()" class="text-xs text-blue-600 hover:underline">管理卡片</button>
                </div>
                <div id="accountExpenseList" class="space-y-3">
                    <p class="text-sm text-slate-400 text-center py-4">當月尚無支出紀錄</p>
                </div>
            </section>
        </div>

        <!-- 日曆月視圖 -->
        <section class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <!-- 星期標題 -->
            <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 mb-2">
                <span class="text-rose-400">日</span>
                <span>一</span>
                <span>二</span>
                <span>三</span>
                <span>四</span>
                <span>五</span>
                <span class="text-indigo-400">六</span>
            </div>
            <!-- 日期方格 -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2">
                <!-- 動態注入日期 -->
            </div>
        </section>

    </main>

    <!-- 浮動記賬快捷按鈕 -->
    <div class="fixed bottom-6 right-6 z-20">
        <button onclick="openDayModal(new Date().toISOString().split('T')[0])" class="w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 flex items-center justify-center transition">
            <i class="fa-solid fa-plus text-xl"></i>
        </button>
    </div>

    <!-- 彈窗 1: 日記賬/明細彈窗 (Day Modal) -->
    <div id="dayModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl border border-slate-100 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 id="modalDateTitle" class="font-bold text-slate-800 text-base">2026-09-09 明細</h3>
                <button onclick="closeDayModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- 明細清單 -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">當日記賬列表</h4>
                    <div id="modalEntriesList" class="space-y-2">
                        <!-- 動態單日記錄 -->
                    </div>
                </div>

                <!-- 新增表記錄 -->
                <form id="addEntryForm" onsubmit="handleSaveEntry(event)" class="pt-4 border-t border-slate-100 space-y-3">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">新增項目</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="entryType" class="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                            <option value="expense">支出 (-)</option>
                            <option value="income">收入 (+)</option>
                        </select>
                        <input type="number" step="0.01" id="entryAmount" placeholder="金額 (HK$)" required class="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <!-- 類別下拉選單 -->
                        <select id="entryCategory" class="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                            <!-- 動態注入 -->
                        </select>
                        <!-- 支付方式下拉選單 -->
                        <select id="entryAccount" class="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                            <!-- 動態注入 -->
                        </select>
                    </div>
                    <input type="text" id="entryTitle" placeholder="備註/名稱 (例如: Lunch, 7-11)" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    
                    <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
                        儲存項目
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 彈窗 2: 設定彈窗 (Settings Modal) -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl border border-slate-100 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-base">財務與支付管理設定</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-6 flex-1 text-sm">
                <!-- GAS 雲端 API 設定 -->
                <div class="space-y-2">
                    <label class="block font-semibold text-slate-700">Google Apps Script Web App URL</label>
                    <input type="url" id="configGasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-slate-400">填入 GAS 部署之 Web App 網址以支援雲端同步。</p>
                </div>

                <!-- 支付方式 / 信用卡自定義管理 -->
                <div class="space-y-3 pt-4 border-t border-slate-100">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="block font-semibold text-slate-700">💳 支付方式 / 信用卡列表</span>
                            <span class="text-xs text-slate-400">記賬下拉選單與支出統計之依據</span>
                        </div>
                        <button type="button" onclick="addAccountSettingRow()" class="text-xs text-blue-600 hover:text-blue-700 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-plus mr-1"></i> 新增卡片/賬戶
                        </button>
                    </div>
                    <div id="accountInputsContainer" class="space-y-2">
                        <!-- 動態注入各支付方式 -->
                    </div>
                </div>

                <!-- 動態類別預算設定 -->
                <div class="space-y-3 pt-4 border-t border-slate-100">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="block font-semibold text-slate-700">📊 每月類別預算限制 (HK$)</span>
                            <span class="text-xs text-slate-400">名稱需與記賬分類一致</span>
                        </div>
                        <button type="button" onclick="addBudgetSettingRow()" class="text-xs text-blue-600 hover:text-blue-700 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg">
                            <i class="fa-solid fa-plus mr-1"></i> 新增類別
                        </button>
                    </div>
                    <div id="budgetInputsContainer" class="space-y-2">
                        <!-- 動態注入各類別預算輸入框 -->
                    </div>
                </div>
            </div>

            <div class="px-5 py-3 border-t border-slate-100 bg-slate-50 flex justify-end space-x-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">取消</button>
                <button onclick="saveFinancialConfig()" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition">儲存所有設定</button>
            </div>
        </div>
    </div>

    <!-- 彈窗 3: 備份與還原 (Backup Modal) -->
    <div id="backupModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl border border-slate-100 overflow-hidden flex flex-col">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-base">本地資料備份與還原</h3>
                <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 text-sm">
                <button onclick="exportDataToJson()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-download"></i>
                    <span>匯出完整 JSON 備份檔</span>
                </button>
                <div class="pt-3 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">匯入 JSON 檔案還原</label>
                    <input type="file" id="importJsonFile" accept=".json" class="text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        // 常數與預設配置
        const STORAGE_KEY_DATA = 'my_cal_data';
        const STORAGE_KEY_CONFIG = 'my_cal_financial_config';

        // 預設支援香港主流卡別與分類
        const DEFAULT_ACCOUNTS = ['MMpower', 'Cathay', 'EveryMile', 'PayMe', '八達通', 'Cash'];
        const DEFAULT_BUDGETS = {
            'Daily': 3000,
            '家用': 5000,
            '餐飲飲食': 4000,
            '交通出行': 1000
        };

        let currentDate = new Date();
        let activeModalDateStr = '';
        let financialData = [];
        let financialConfig = {
            gasUrl: '',
            accounts: [...DEFAULT_ACCOUNTS],
            budgets: { ...DEFAULT_BUDGETS }
        };

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadStoredConfig();
            loadStoredData();
            renderCalendar();
            renderFinancialSummary();
        });

        // 載入設定
        function loadStoredConfig() {
            const raw = localStorage.getItem(STORAGE_KEY_CONFIG);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    financialConfig.gasUrl = parsed.gasUrl || '';
                    financialConfig.accounts = Array.isArray(parsed.accounts) && parsed.accounts.length > 0 ? parsed.accounts : [...DEFAULT_ACCOUNTS];
                    financialConfig.budgets = (parsed.budgets && typeof parsed.budgets === 'object') ? parsed.budgets : { ...DEFAULT_BUDGETS };
                } catch (e) {
                    console.error('解析設定錯誤', e);
                }
            }
        }

        // 載入記賬資料
        function loadStoredData() {
            const raw = localStorage.getItem(STORAGE_KEY_DATA);
            if (raw) {
                try {
                    financialData = JSON.parse(raw);
                } catch (e) {
                    financialData = [];
                }
            }
        }

        function saveStoredData() {
            localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(financialData));
        }

        // 月份切換
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
            renderFinancialSummary();
        }

        // 渲染日曆
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth(); // 0-based
            document.getElementById('currentMonthYearText').textContent = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 上月補位
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[75px] sm:min-h-[90px] p-1.5 rounded-xl bg-slate-50/50 text-slate-300 text-xs border border-transparent';
                dayDiv.innerHTML = `<span class="font-semibold">${prevMonthDays - i}</span>`;
                grid.appendChild(dayDiv);
            }

            const todayStr = new Date().toISOString().split('T')[0];

            // 當月日期
            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = (dayStr === todayStr);

                // 篩選當日記錄
                const dayEntries = financialData.filter(item => {
                    const cleanDate = (item.date || '').split('T')[0].trim();
                    return cleanDate === dayStr;
                });

                let dayExpense = 0;
                let dayIncome = 0;

                dayEntries.forEach(item => {
                    const cleanType = String(item.type || '').trim().toLowerCase();
                    const cleanAmt = parseFloat(String(item.amount || '0').replace(/,/g, '')) || 0;
                    if (cleanType === 'expense' || cleanType === 'expenses') {
                        dayExpense += cleanAmt;
                    } else if (cleanType === 'income' || cleanType === 'incomes') {
                        dayIncome += cleanAmt;
                    }
                });

                const dayDiv = document.createElement('div');
                dayDiv.className = `min-h-[75px] sm:min-h-[90px] p-1.5 rounded-xl border flex flex-col justify-between transition cursor-pointer ${
                    isToday ? 'bg-blue-50/40 border-blue-300 shadow-sm' : 'bg-white hover:bg-slate-50 border-slate-100'
                }`;
                dayDiv.onclick = () => openDayModal(dayStr);

                let badgeHtml = '';
                if (dayExpense > 0) {
                    badgeHtml += `<span class="text-[10px] font-medium text-rose-600 truncate block">-HK$${dayExpense.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span>`;
                }
                if (dayIncome > 0) {
                    badgeHtml += `<span class="text-[10px] font-medium text-emerald-600 truncate block">+HK$${dayIncome.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span>`;
                }

                dayDiv.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold ${isToday ? 'text-blue-600 bg-blue-100 rounded-full w-5 h-5 flex items-center justify-center' : 'text-slate-700'}">${d}</span>
                        ${dayEntries.length > 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>` : ''}
                    </div>
                    <div class="space-y-0.5 mt-1 overflow-hidden">
                        ${badgeHtml}
                    </div>
                `;
                grid.appendChild(dayDiv);
            }
        }

        // 渲染當月財務統計、類別預算進度及信用卡支出佔比
        function renderFinancialSummary() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const targetMonthPrefix = `${year}-${String(month).padStart(2, '0')}`;

            let totalIncome = 0;
            let totalExpense = 0;
            const categoryExpenses = {};
            const accountExpenses = {};

            // 初始化各支付方式累計
            (financialConfig.accounts || []).forEach(acc => {
                accountExpenses[acc] = 0;
            });

            // 計算當月收支
            financialData.forEach(item => {
                const cleanDate = (item.date || '').split('T')[0].trim();
                if (cleanDate.startsWith(targetMonthPrefix)) {
                    const cleanType = String(item.type || '').trim().toLowerCase();
                    const cleanAmt = parseFloat(String(item.amount || '0').replace(/,/g, '')) || 0;
                    const cat = (item.category || '未分類').trim();
                    const acc = (item.account || '未分類').trim();

                    if (cleanType === 'expense' || cleanType === 'expenses') {
                        totalExpense += cleanAmt;
                        categoryExpenses[cat] = (categoryExpenses[cat] || 0) + cleanAmt;
                        
                        // 累加對應支付方式
                        accountExpenses[acc] = (accountExpenses[acc] || 0) + cleanAmt;
                    } else if (cleanType === 'income' || cleanType === 'incomes') {
                        totalIncome += cleanAmt;
                    }
                }
            });

            // 更新頂部卡片
            const netBalance = totalIncome - totalExpense;
            const totalBudget = Object.values(financialConfig.budgets || {}).reduce((a, b) => a + Number(b || 0), 0);

            document.getElementById('statTotalIncome').textContent = `HK$ ${totalIncome.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('statTotalExpense').textContent = `HK$ ${totalExpense.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('statNetBalance').textContent = `HK$ ${netBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('statTotalBudget').textContent = `HK$ ${totalBudget.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            // 渲染類別預算列表
            const budgetContainer = document.getElementById('budgetProgressList');
            const budgetKeys = Object.keys(financialConfig.budgets || {});

            if (budgetKeys.length === 0) {
                budgetContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">尚未設定預算分類，請點擊上方調整預算。</p>`;
            } else {
                let budgetHtml = '';
                budgetKeys.forEach(cat => {
                    const limit = Number(financialConfig.budgets[cat]) || 0;
                    const spent = categoryExpenses[cat] || 0;
                    const pct = limit > 0 ? Math.min(Math.round((spent / limit) * 100), 100) : (spent > 0 ? 100 : 0);
                    const isOver = limit > 0 && spent > limit;

                    budgetHtml += `
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-700">${cat}</span>
                                <span class="${isOver ? 'text-rose-600 font-bold' : 'text-slate-500'}">
                                    HK$ ${spent.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})} / ${limit.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}
                                    <span class="ml-1 text-[11px] ${isOver ? 'text-rose-600' : 'text-slate-400'}">(${pct}%)</span>
                                </span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300 ${isOver ? 'bg-rose-500' : 'bg-indigo-500'}" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                });
                budgetContainer.innerHTML = budgetHtml;
            }

            // 渲染支付方式支出佔比列表
            const accountContainer = document.getElementById('accountExpenseList');
            const activeAccounts = Object.keys(accountExpenses).filter(acc => accountExpenses[acc] > 0);

            if (activeAccounts.length === 0) {
                accountContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">當月尚無任何支付卡消費記錄。</p>`;
            } else {
                // 按照花費金額由大到小排序
                activeAccounts.sort((a, b) => accountExpenses[b] - accountExpenses[a]);

                let accHtml = '';
                activeAccounts.forEach(acc => {
                    const spent = accountExpenses[acc] || 0;
                    const pct = totalExpense > 0 ? Math.round((spent / totalExpense) * 100) : 0;

                    accHtml += `
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-700 flex items-center">
                                    <i class="fa-solid fa-credit-card text-[10px] text-blue-500 mr-1.5"></i> ${acc}
                                </span>
                                <span class="text-slate-600">
                                    HK$ ${spent.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 2})}
                                    <span class="ml-1 text-[11px] text-slate-400 font-normal">(${pct}%)</span>
                                </span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                <div class="h-full bg-blue-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                });
                accountContainer.innerHTML = accHtml;
            }
        }

        // 打開特定日期彈窗
        function openDayModal(dateStr) {
            activeModalDateStr = dateStr;
            document.getElementById('modalDateTitle').textContent = `${dateStr} 明細與記賬`;

            // 動態更新下拉選單選項
            populateModalDropdowns();

            // 渲染當日歷史紀錄
            renderModalEntries();

            // 重置表單
            document.getElementById('addEntryForm').reset();

            document.getElementById('dayModal').classList.remove('hidden');
        }

        function closeDayModal() {
            document.getElementById('dayModal').classList.add('hidden');
        }

        // 動態注入彈窗中的類別與支付卡選單
        function populateModalDropdowns() {
            const catSelect = document.getElementById('entryCategory');
            const accSelect = document.getElementById('entryAccount');

            // 類別選單
            catSelect.innerHTML = '';
            const budgetKeys = Object.keys(financialConfig.budgets || {});
            if (budgetKeys.length === 0) {
                catSelect.innerHTML = '<option value="一般">一般</option>';
            } else {
                budgetKeys.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    catSelect.appendChild(opt);
                });
            }

            // 支付卡選單
            accSelect.innerHTML = '';
            const accKeys = financialConfig.accounts || DEFAULT_ACCOUNTS;
            accKeys.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc;
                opt.textContent = acc;
                accSelect.appendChild(opt);
            });
        }

        // 渲染單日記錄
        function renderModalEntries() {
            const container = document.getElementById('modalEntriesList');
            container.innerHTML = '';

            const entries = financialData.filter(item => {
                const cleanDate = (item.date || '').split('T')[0].trim();
                return cleanDate === activeModalDateStr;
            });

            if (entries.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">此日尚無任何記錄</p>`;
                return;
            }

            entries.forEach((item, index) => {
                const cleanType = String(item.type || '').trim().toLowerCase();
                const isExpense = (cleanType === 'expense' || cleanType === 'expenses');
                const cleanAmt = parseFloat(String(item.amount || '0').replace(/,/g, '')) || 0;

                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs';
                row.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="font-bold text-slate-800 truncate">${item.title || '無名稱'}</div>
                        <div class="text-[10px] text-slate-400 flex items-center space-x-2 mt-0.5">
                            <span class="bg-slate-200/60 px-1.5 py-0.5 rounded text-slate-600">${item.category || '未分類'}</span>
                            <span class="bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-medium">${item.account || '未指定'}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold ${isExpense ? 'text-rose-600' : 'text-emerald-600'}">
                            ${isExpense ? '-' : '+'}HK$${cleanAmt.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                        </span>
                        <button onclick="deleteEntry('${item.id || ''}', ${index})" class="text-slate-300 hover:text-rose-500 p-1 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // 新增記賬
        function handleSaveEntry(e) {
            e.preventDefault();
            const type = document.getElementById('entryType').value;
            const amount = parseFloat(document.getElementById('entryAmount').value);
            const category = document.getElementById('entryCategory').value;
            const account = document.getElementById('entryAccount').value;
            const title = document.getElementById('entryTitle').value.trim();

            if (isNaN(amount) || amount <= 0) {
                alert('請輸入有效金額！');
                return;
            }

            const newEntry = {
                id: 'id_' + Date.now(),
                date: activeModalDateStr,
                type: type,
                amount: amount,
                category: category,
                account: account,
                title: title
            };

            financialData.push(newEntry);
            saveStoredData();
            renderModalEntries();
            renderCalendar();
            renderFinancialSummary();

            document.getElementById('entryAmount').value = '';
            document.getElementById('entryTitle').value = '';
        }

        // 刪除記賬
        function deleteEntry(id, fallbackIndex) {
            if (!confirm('確定要刪除這筆項目嗎？')) return;
            if (id) {
                financialData = financialData.filter(i => i.id !== id);
            } else {
                // 若為雲端同步無 ID 者以 activeModalDateStr 與 index 刪除
                const dayIndexes = [];
                financialData.forEach((item, idx) => {
                    const cleanDate = (item.date || '').split('T')[0].trim();
                    if (cleanDate === activeModalDateStr) dayIndexes.push(idx);
                });
                if (dayIndexes[fallbackIndex] !== undefined) {
                    financialData.splice(dayIndexes[fallbackIndex], 1);
                }
            }
            saveStoredData();
            renderModalEntries();
            renderCalendar();
            renderFinancialSummary();
        }

        // 打開設定彈窗
        function openSettingsModal() {
            document.getElementById('configGasUrl').value = financialConfig.gasUrl || '';
            renderAccountSettingsUI();
            renderBudgetSettingsUI();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // 動態卡片/支付方式管理 UI
        function renderAccountSettingsUI() {
            const container = document.getElementById('accountInputsContainer');
            container.innerHTML = '';
            const accounts = financialConfig.accounts || DEFAULT_ACCOUNTS;

            accounts.forEach(acc => {
                addAccountSettingRow(acc);
            });
        }

        function addAccountSettingRow(name = '') {
            const container = document.getElementById('accountInputsContainer');
            const row = document.createElement('div');
            row.className = 'flex items-center space-x-2 account-setting-row';
            row.innerHTML = `
                <div class="relative flex-1">
                    <i class="fa-solid fa-credit-card absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" value="${name}" placeholder="卡名/賬戶 (如: MMpower)" class="account-name-input w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-300 hover:text-rose-500 p-2 transition">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // 動態預算類別管理 UI
        function renderBudgetSettingsUI() {
            const container = document.getElementById('budgetInputsContainer');
            container.innerHTML = '';
            const budgets = financialConfig.budgets || {};

            Object.entries(budgets).forEach(([name, limit]) => {
                addBudgetSettingRow(name, limit);
            });
        }

        function addBudgetSettingRow(name = '', limit = '') {
            const container = document.getElementById('budgetInputsContainer');
            const row = document.createElement('div');
            row.className = 'flex items-center space-x-2 budget-setting-row';
            row.innerHTML = `
                <input type="text" value="${name}" placeholder="分類名稱 (如: 家用)" class="budget-name-input flex-1 px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                <input type="number" step="1" value="${limit}" placeholder="預算限額" class="budget-limit-input w-28 px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-300 hover:text-rose-500 p-2 transition">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // 儲存設定
        function saveFinancialConfig() {
            // 讀取 GAS 網址
            financialConfig.gasUrl = document.getElementById('configGasUrl').value.trim();

            // 動態收集支付方式
            const accRows = document.querySelectorAll('.account-setting-row');
            const newAccounts = [];
            accRows.forEach(row => {
                const name = row.querySelector('.account-name-input').value.trim();
                if (name && !newAccounts.includes(name)) {
                    newAccounts.push(name);
                }
            });
            financialConfig.accounts = newAccounts.length > 0 ? newAccounts : [...DEFAULT_ACCOUNTS];

            // 動態收集分類預算
            const budgetRows = document.querySelectorAll('.budget-setting-row');
            const newBudgets = {};
            budgetRows.forEach(row => {
                const name = row.querySelector('.budget-name-input').value.trim();
                const limit = parseFloat(row.querySelector('.budget-limit-input').value) || 0;
                if (name) {
                    newBudgets[name] = limit;
                }
            });
            financialConfig.budgets = newBudgets;

            localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(financialConfig));
            closeSettingsModal();
            renderFinancialSummary();
            alert('設定已成功儲存！');
        }

        // 與 Google Sheets 雲端同步
        async function syncWithCloud() {
            if (!financialConfig.gasUrl) {
                alert('請先在設定中填入 Google Apps Script Web App URL！');
                openSettingsModal();
                return;
            }

            const icon = document.getElementById('cloudSyncIcon');
            const text = document.getElementById('cloudSyncText');
            icon.classList.add('fa-spin');
            text.textContent = '同步中...';

            try {
                const res = await fetch(financialConfig.gasUrl);
                const cloudJson = await res.json();

                if (Array.isArray(cloudJson)) {
                    // 清洗與相容 Google Sheet 資料
                    const cleanedList = cloudJson.map((item, idx) => {
                        let cleanDate = String(item.date || '').split('T')[0].trim();
                        let cleanAmount = parseFloat(String(item.amount || '0').replace(/,/g, '')) || 0;
                        let rawType = String(item.type || '').trim().toLowerCase();
                        let cleanType = (rawType === 'income' || rawType === 'incomes') ? 'income' : 'expense';

                        return {
                            id: item.id || `cloud_${cleanDate}_${idx}`,
                            date: cleanDate,
                            type: cleanType,
                            amount: cleanAmount,
                            category: String(item.category || '未分類').trim(),
                            account: String(item.account || '未指定').trim(),
                            title: String(item.title || item.note || '').trim()
                        };
                    });

                    financialData = cleanedList;
                    saveStoredData();
                    renderCalendar();
                    renderFinancialSummary();
                    text.textContent = '已同步';
                    setTimeout(() => { text.textContent = '待命'; }, 3000);
                } else {
                    throw new Error('回傳格式並非陣列');
                }
            } catch (err) {
                console.error(err);
                alert('同步失敗，請檢查 GAS 網址與網絡連線：' + err.message);
                text.textContent = '錯誤';
            } finally {
                icon.classList.remove('fa-spin');
            }
        }

        // 備份與還原
        function openBackupModal() {
            document.getElementById('backupModal').classList.remove('hidden');
        }

        function closeBackupModal() {
            document.getElementById('backupModal').classList.add('hidden');
        }

        function exportDataToJson() {
            const fullBackup = {
                config: financialConfig,
                data: financialData,
                exportTime: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `finance_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('importJsonFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.data && Array.isArray(parsed.data)) {
                        financialData = parsed.data;
                        if (parsed.config) financialConfig = parsed.config;
                        saveStoredData();
                        localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(financialConfig));
                        renderCalendar();
                        renderFinancialSummary();
                        closeBackupModal();
                        alert('還原成功！');
                    } else {
                        alert('無效的備份檔案格式！');
                    }
                } catch (err) {
                    alert('讀取失敗：' + err.message);
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
