<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的智能日程 & 記賬日曆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* 1. 蘋果原生風 (Apple Modern) */
    body.theme-apple {
      background-color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.06);
      --cell-bg: #ffffff;
      --cell-hover: #fbfbfd;
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --primary-btn: #0071e3;
      --primary-hover: #0077ed;
      --badge-bg: #e8f2ff;
      --badge-text: #0066cc;
      --holiday-text: #ff3b30;
      --holiday-bg: #fff2f2;
      --blur: blur(20px);
    }

    /* 2. Notion 極簡風 */
    body.theme-notion {
      background-color: #f7f6f3;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --cell-bg: #ffffff;
      --cell-hover: #f1f0ee;
      --text-main: #37352f;
      --text-sub: #787774;
      --primary-btn: #37352f;
      --primary-hover: #201f1d;
      --badge-bg: #f1f0ef;
      --badge-text: #37352f;
      --holiday-text: #eb5757;
      --holiday-bg: #fdf5f5;
      --blur: none;
    }
    body.theme-notion h1, body.theme-notion h2 {
      font-family: "Lora", serif;
      letter-spacing: -0.02em;
    }

    /* 3. 莫蘭迪大地風 (Morandi Earth) */
    body.theme-morandi {
      background-color: #f3efe9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --card-bg: #faf7f2;
      --card-border: #e2ded7;
      --cell-bg: #faf7f2;
      --cell-hover: #ede7de;
      --text-main: #4a443f;
      --text-sub: #8d857d;
      --primary-btn: #6e7c70;
      --primary-hover: #5d6a5f;
      --badge-bg: #e5ebe6;
      --badge-text: #485c4c;
      --holiday-text: #a86454;
      --holiday-bg: #f5ebe8;
      --blur: none;
    }

    /* 4. 深色暗黑風 (Dark Mode) */
    body.theme-dark {
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --card-bg: #151d30;
      --card-border: #232f48;
      --cell-bg: #121826;
      --cell-hover: #1c263c;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --primary-btn: #3b82f6;
      --primary-hover: #2563eb;
      --badge-bg: #1e293b;
      --badge-text: #60a5fa;
      --holiday-text: #f87171;
      --holiday-bg: #2a1b22;
      --blur: none;
    }

    .theme-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }
    .theme-cell {
      background-color: var(--cell-bg);
      color: var(--text-main);
    }
    .theme-cell:hover {
      background-color: var(--cell-hover);
    }
    .theme-btn-primary {
      background-color: var(--primary-btn);
      color: #ffffff;
    }
    .theme-btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .theme-badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
    }
    .holiday-cell {
      background-color: var(--holiday-bg) !important;
    }
    .holiday-color {
      color: var(--holiday-text) !important;
    }
    .text-sub {
      color: var(--text-sub);
    }
  </style>
</head>
<body class="theme-apple min-h-screen p-3 sm:p-6 md:p-8 transition-colors duration-300">

  <div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- 頂部 Header & 主題切換 -->
    <header class="theme-card p-4 sm:p-5 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition-all">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
          <span>🗓️</span> 智能日程 & 記賬
        </h1>
        <p class="text-xs text-sub mt-1">香港法定假期 ‧ 本地智能語意解析（免聯網零報錯）</p>
      </div>

      <!-- 右側：切換風格 & API 設定 -->
      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
        <!-- 風格下拉選單 -->
        <select id="themeSelector" onchange="changeTheme(this.value)" class="text-xs px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent font-medium cursor-pointer focus:outline-none">
          <option value="theme-apple">🍎 蘋果原生風</option>
          <option value="theme-notion">📓 Notion 極簡</option>
          <option value="theme-morandi">🍵 莫蘭迪大地</option>
          <option value="theme-dark">🌙 暗黑深夜風</option>
        </select>

        <button onclick="toggleApiInput()" class="text-xs text-sub hover:underline px-2 py-1">API Key</button>
      </div>
    </header>

    <!-- 摺疊 API 輸入框（平時隱藏保持極簡） -->
    <div id="apiKeySection" class="hidden theme-card p-4 rounded-xl shadow-sm flex gap-2 items-center">
      <input id="apiKeyInput" type="password" placeholder="可選：Groq/OpenRouter Key（留空亦能完美運作）" class="flex-1 text-xs px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none">
      <button onclick="saveApiKey()" class="theme-btn-primary text-xs px-4 py-2 rounded-lg font-medium">儲存</button>
    </div>

    <!-- 自然語言輸入框 -->
    <section class="theme-card p-4 sm:p-5 rounded-2xl shadow-sm space-y-3 transition-all">
      <div class="flex gap-2">
        <input id="naturalInput" type="text" 
          placeholder="聽日下晝3點見客，搭的士85蚊；26號交水費300" 
          class="flex-1 px-4 py-3 rounded-xl text-sm border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500/50"
          onkeydown="if(event.key==='Enter') processInput()">
        <button id="sendBtn" onclick="processInput()" class="theme-btn-primary font-medium text-sm px-5 py-3 rounded-xl transition flex items-center gap-1 shadow-sm shrink-0">
          <span>記錄</span>
        </button>
      </div>
      <p id="statusMsg" class="text-xs text-blue-500 hidden font-medium animate-pulse">⚡ 正在分析語意...</p>
    </section>

    <!-- 月份控制器 & 統計 -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-3 px-1">
      <div class="flex items-center gap-2">
        <button onclick="changeMonth(-1)" class="theme-card w-8 h-8 rounded-lg flex items-center justify-center hover:opacity-80">◀</button>
        <h2 id="currentMonthYear" class="text-base sm:text-lg font-bold min-w-[120px] text-center tracking-tight"></h2>
        <button onclick="changeMonth(1)" class="theme-card w-8 h-8 rounded-lg flex items-center justify-center hover:opacity-80">▶</button>
        <button onclick="goToToday()" class="text-xs px-2.5 py-1.5 rounded-md font-medium text-sub hover:opacity-80">今天</button>
      </div>

      <div class="theme-card px-4 py-2 rounded-xl text-xs flex gap-4 font-medium shadow-sm">
        <div>本月日程：<span id="monthEventCount" class="font-bold text-blue-500">0</span> 項</div>
        <div>本月總開支：<span id="monthExpenseTotal" class="font-bold text-rose-500">$0</span></div>
      </div>
    </div>

    <!-- 月曆網格主體 -->
    <section class="theme-card rounded-2xl shadow-sm overflow-hidden border">
      <!-- 星期 Header -->
      <div class="grid grid-cols-7 text-center text-xs font-semibold py-2.5 border-b border-slate-200 dark:border-slate-800 text-sub">
        <div class="holiday-color">日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div class="holiday-color">六</div>
      </div>
      <!-- 天數網格 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-px bg-slate-200 dark:bg-slate-800 min-h-[500px]"></div>
    </section>

  </div>

  <!-- 單日詳情彈窗 Modal -->
  <div id="dayModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="theme-card rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border">
      <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
        <div>
          <h3 id="modalDateTitle" class="font-bold text-base"></h3>
          <p id="modalHolidayTitle" class="text-xs holiday-color font-semibold mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="text-sub hover:text-slate-900 dark:hover:text-white text-lg">✕</button>
      </div>

      <div>
        <h4 class="text-xs font-bold text-sub uppercase tracking-wider mb-2">📌 當日日程</h4>
        <div id="modalEventList" class="space-y-1.5 text-sm max-h-40 overflow-y-auto"></div>
      </div>

      <div>
        <h4 class="text-xs font-bold text-sub uppercase tracking-wider mb-2">💰 當日花費明細</h4>
        <div id="modalExpenseList" class="space-y-1.5 text-sm max-h-40 overflow-y-auto"></div>
      </div>

      <div class="pt-2 text-right">
        <button onclick="closeModal()" class="theme-card text-xs px-4 py-2 rounded-lg font-medium hover:opacity-80">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 2026 香港公眾假期
    const HK_HOLIDAYS_2026 = {
      "2026-01-01": "元旦", "2026-02-17": "農曆年初一", "2026-02-18": "農曆年初二",
      "2026-02-19": "農曆年初三", "2026-04-03": "耶穌受難節", "2026-04-04": "受難節翌日/清明節",
      "2026-04-06": "復活節星期一翌日", "2026-05-01": "勞動節", "2026-05-24": "佛誕",
      "2026-05-25": "佛誕翌日", "2026-06-19": "端午節", "2026-07-01": "特區成立紀念日",
      "2026-09-26": "中秋節翌日", "2026-10-01": "國慶日", "2026-10-19": "重陽節",
      "2026-12-25": "聖誕節", "2026-12-26": "節禮日"
    };

    let appData = JSON.parse(localStorage.getItem('my_cal_data') || '{"events": [], "expenses": []}');
    let currentDate = new Date();

    // 讀取主題
    const savedTheme = localStorage.getItem('app_theme') || 'theme-apple';
    document.body.className = `${savedTheme} min-h-screen p-3 sm:p-6 md:p-8 transition-colors duration-300`;
    document.getElementById('themeSelector').value = savedTheme;

    function changeTheme(themeName) {
      document.body.className = `${themeName} min-h-screen p-3 sm:p-6 md:p-8 transition-colors duration-300`;
      localStorage.setItem('app_theme', themeName);
    }

    function toggleApiInput() {
      const el = document.getElementById('apiKeySection');
      el.classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('user_api_key', key);
      alert('Key 已保存！留空亦能自動運作。');
      toggleApiInput();
    }

    function saveData() {
      localStorage.setItem('my_cal_data', JSON.stringify(appData));
      renderCalendar();
    }

    // ========== 內建本地智能語意引擎 ==========
    function parseLocally(text) {
      const now = new Date();
      let targetDate = new Date(now);
      
      if (text.includes("今日") || text.includes("今天")) {
        // targetDate 不變
      } else if (text.includes("聽日") || text.includes("明天")) {
        targetDate.setDate(targetDate.getDate() + 1);
      } else if (text.includes("後日") || text.includes("后天")) {
        targetDate.setDate(targetDate.getDate() + 2);
      } else {
        const dateMatch = text.match(/(?:(\d{4})[年/-])?(\d{1,2})[月/-](\d{1,2})[日號号]?/);
        if (dateMatch) {
          const y = dateMatch[1] ? parseInt(dateMatch[1]) : now.getFullYear();
          const m = parseInt(dateMatch[2]) - 1;
          const d = parseInt(dateMatch[3]);
          targetDate = new Date(y, m, d);
        } else {
          const weekMap = { "日": 0, "天": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6 };
          const weekMatch = text.match(/(下周|下星期|星期|周)([日天一二三四五六])/);
          if (weekMatch) {
            const isNext = weekMatch[1].startsWith("下");
            const targetDay = weekMap[weekMatch[2]];
            let diff = targetDay - now.getDay();
            if (diff <= 0 || isNext) diff += 7;
            targetDate.setDate(now.getDate() + diff);
          }
        }
      }

      const dateStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth() + 1).padStart(2, '0')}-${String(targetDate.getDate()).padStart(2, '0')}`;

      // 時間提取
      let timeStr = "";
      const timeMatch = text.match(/(上晝|早上|上午|下晝|下午|夜晚|晚上)?\s*(\d{1,2})[點点:：](\d{2})?/);
      if (timeMatch) {
        let h = parseInt(timeMatch[2]);
        const m = timeMatch[3] ? timeMatch[3] : "00";
        const period = timeMatch[1] || "";
        if ((period.includes("下") || period.includes("晚")) && h < 12) h += 12;
        timeStr = `${String(h).padStart(2, '0')}:${m}`;
      }

      const events = [];
      const expenses = [];

      // 開銷提取
      const expenseMatch = text.match(/(.+?)(?:用咗|花了|買|支出|畀咗)?\s*[$￥]?\s*(\d+(?:\.\d+)?)\s*(?:蚊|元|塊|塊錢|HKD|hkd)?/);
      if (expenseMatch && (text.includes("蚊") || text.includes("$") || text.includes("用咗") || text.includes("花") || text.includes("元"))) {
        const amount = parseFloat(expenseMatch[2]);
        let item = expenseMatch[1].replace(/(聽日|明天|今日|今天|下晝|上午|下午|\d+[月號日])/g, '').trim();
        if (!item) item = "日常支出";
        expenses.push({ date: dateStr, category: "支出", item: item, amount: amount });
      }

      // 日程提取
      let cleanTitle = text.replace(/(聽日|明天|今日|今天|下星期[一二三四五六天日]|星期[一二三四五六天日]|\d+[月/-]\d+[日號号]?|上晝|下晝|上午|下午|\d{1,2}[點点:：]\d{0,2})/g, '')
                           .replace(/用咗.*|花了.*|[$￥]\d+.*|\d+蚊.*/g, '')
                           .replace(/[，,;；]/g, '')
                           .trim();

      if (cleanTitle.length > 0) {
        events.push({ date: dateStr, time: timeStr, title: cleanTitle });
      }

      return { events, expenses };
    }

    // 主處理函數
    async function processInput() {
      const text = document.getElementById('naturalInput').value.trim();
      if (!text) return;

      const key = localStorage.getItem('user_api_key');
      const status = document.getElementById('statusMsg');
      const btn = document.getElementById('sendBtn');
      status.classList.remove('hidden');
      btn.disabled = true;

      if (key) {
        try {
          const isGroq = key.startsWith('gsk_');
          const endpoint = isGroq 
            ? 'https://api.groq.com/openai/v1/chat/completions' 
            : 'https://openrouter.ai/api/v1/chat/completions';
          const model = isGroq ? 'llama-3.3-70b-versatile' : 'meta-llama/llama-3.3-70b-instruct:free';

          const prompt = `今天是 ${new Date().toISOString().split('T')[0]}。請分析此語句，提取日程(events)與花費(expenses)。
必須輸出嚴格純 JSON：{"events":[{"date":"YYYY-MM-DD","time":"HH:mm 或空","title":"名稱"}],"expenses":[{"date":"YYYY-MM-DD","category":"類別","item":"品項","amount":數字}]}
句子：「${text}」`;

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({ model: model, messages: [{ role: 'user', content: prompt }], temperature: 0.1 })
          });

          if (res.ok) {
            const data = await res.json();
            let rawText = data.choices[0].message.content.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
            const parsed = JSON.parse(rawText);
            if (parsed.events) appData.events.push(...parsed.events);
            if (parsed.expenses) appData.expenses.push(...parsed.expenses);
            finish();
            return;
          }
        } catch (e) {
          console.warn("API 備援切換至本地：", e);
        }
      }

      // 本地解析
      const local = parseLocally(text);
      if (local.events.length > 0) appData.events.push(...local.events);
      if (local.expenses.length > 0) appData.expenses.push(...local.expenses);
      finish();

      function finish() {
        saveData();
        document.getElementById('naturalInput').value = '';
        status.classList.add('hidden');
        btn.disabled = false;
      }
    }

    // 日曆渲染
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('currentMonthYear').innerText = `${year} 年 ${month + 1} 月`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      let monthEventCount = 0;
      let monthExpenseTotal = 0;

      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = 'theme-cell opacity-40 min-h-[90px]';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const holidayName = HK_HOLIDAYS_2026[dateStr];

        const dayEvents = appData.events.filter(e => e.date === dateStr);
        const dayExpenses = appData.expenses.filter(e => e.date === dateStr);

        monthEventCount += dayEvents.length;
        const dayExpenseSum = dayExpenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        monthExpenseTotal += dayExpenseSum;

        const cell = document.createElement('div');
        cell.className = `theme-cell p-1.5 sm:p-2 flex flex-col justify-between cursor-pointer transition min-h-[95px] ${holidayName ? 'holiday-cell' : ''}`;
        cell.onclick = () => openModal(dateStr, holidayName, dayEvents, dayExpenses);

        let topBar = `<div class="flex justify-between items-start">
          <span class="text-xs font-bold ${holidayName || isWeekend ? 'holiday-color' : ''}">${day}</span>
          ${holidayName ? `<span class="text-[10px] holiday-color font-semibold truncate max-w-[65px]">${holidayName}</span>` : ''}
        </div>`;

        let tags = `<div class="space-y-1 mt-1 overflow-hidden">`;
        dayEvents.slice(0, 2).forEach(ev => {
          tags += `<div class="text-[10px] theme-badge px-1.5 py-0.5 rounded truncate font-medium">📌 ${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
        });
        if (dayEvents.length > 2) {
          tags += `<div class="text-[9px] text-sub font-semibold">+${dayEvents.length - 2} 更多</div>`;
        }
        tags += `</div>`;

        let bottom = dayExpenseSum > 0 ? `<div class="text-[10px] text-rose-500 font-bold text-right mt-1">-$${dayExpenseSum}</div>` : `<div></div>`;

        cell.innerHTML = topBar + tags + bottom;
        grid.appendChild(cell);
      }

      document.getElementById('monthEventCount').innerText = monthEventCount;
      document.getElementById('monthExpenseTotal').innerText = `$${monthExpenseTotal.toLocaleString()}`;
    }

    function openModal(dateStr, holiday, events, expenses) {
      document.getElementById('modalDateTitle').innerText = dateStr;
      document.getElementById('modalHolidayTitle').innerText = holiday ? `🇭🇰 香港公眾假期：${holiday}` : '';

      const evList = document.getElementById('modalEventList');
      evList.innerHTML = events.length === 0 ? '<p class="text-sub text-xs">無安排日程</p>' : '';
      events.forEach((ev, idx) => {
        evList.innerHTML += `
          <div class="flex justify-between items-center theme-cell p-2 rounded-lg border border-slate-100 dark:border-slate-800">
            <span>📌 <b class="text-blue-500">${ev.time || '全天'}</b> ${ev.title}</span>
            <button onclick="deleteEvent('${dateStr}', ${idx})" class="text-sub hover:text-rose-500 text-xs">刪除</button>
          </div>
        `;
      });

      const exList = document.getElementById('modalExpenseList');
      exList.innerHTML = expenses.length === 0 ? '<p class="text-sub text-xs">無花費記錄</p>' : '';
      expenses.forEach((ex, idx) => {
        exList.innerHTML += `
          <div class="flex justify-between items-center theme-cell p-2 rounded-lg border border-slate-100 dark:border-slate-800">
            <span>💸 [${ex.category || '支出'}] ${ex.item}</span>
            <div class="flex items-center gap-2">
              <span class="font-bold text-rose-500">-$${ex.amount}</span>
              <button onclick="deleteExpense('${dateStr}', ${idx})" class="text-sub hover:text-rose-500 text-xs">刪除</button>
            </div>
          </div>
        `;
      });

      document.getElementById('dayModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('dayModal').classList.add('hidden');
    }

    function deleteEvent(dateStr, index) {
      const targetIndices = [];
      appData.events.forEach((e, idx) => { if (e.date === dateStr) targetIndices.push(idx); });
      appData.events.splice(targetIndices[index], 1);
      saveData();
      closeModal();
    }

    function deleteExpense(dateStr, index) {
      const targetIndices = [];
      appData.expenses.forEach((e, idx) => { if (e.date === dateStr) targetIndices.push(idx); });
      appData.expenses.splice(targetIndices[index], 1);
      saveData();
      closeModal();
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
