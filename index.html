<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <!-- Web App & iOS 專屬主畫面 Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MyLife">

    <!-- 內建高品質漸層 App 圖標 (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233B82F6'/%3E%3Cstop offset='50%25' stop-color='%236366F1'/%3E%3Cstop offset='100%25' stop-color='%238B5CF6'/%3E%3Cstop offset='100%25' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='115' fill='url(%23g)'/%3E%3Cpath fill='%23ffffff' d='M256 80c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176S353.2 80 256 80zm70 110l-42.3 98.6c-2.4 5.6-6.8 10-12.4 12.4L172.7 343.3c-7.6 3.3-15.6-4.7-12.3-12.3l42.3-98.6c2.4-5.6 6.8-10 12.4-12.4l98.6-42.3c7.6-3.3 15.6 4.7 12.3 12.3z'/%3E%3C/svg%3E">

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233B82F6'/%3E%3Cstop offset='50%25' stop-color='%236366F1'/%3E%3Cstop offset='100%25' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='115' fill='url(%23g)'/%3E%3Cpath fill='%23ffffff' d='M256 80c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176S353.2 80 256 80zm70 110l-42.3 98.6c-2.4 5.6-6.8 10-12.4 12.4L172.7 343.3c-7.6 3.3-15.6-4.7-12.3-12.3l42.3-98.6c2.4-5.6 6.8-10 12.4-12.4l98.6-42.3c7.6-3.3 15.6 4.7 12.3 12.3z'/%3E%3C/svg%3E">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyLife Hub</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 啟用 Tailwind class 深色模式切換
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SortableJS (支援模組拖曳排序) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .sortable-ghost {
            opacity: 0.4;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-16 transition-colors duration-200">

    <!-- 頂部導航列 -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-sm transition-colors duration-200">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span id="appNameDisplay" onclick="renameApp()" class="text-xl font-bold bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition flex items-center gap-1.5" title="點擊修改名稱">
                    <i class="fa-solid fa-compass text-blue-600 dark:text-blue-400"></i>
                    <span id="appNameText">MyLife Hub</span>
                    <i class="fa-solid fa-pen text-[10px] text-slate-400 opacity-60"></i>
                </span>
                <span id="cloudSyncStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 font-medium transition-colors">
                    <i id="cloudSyncIcon" class="fa-solid fa-cloud mr-1"></i> <span id="cloudSyncText">待命</span>
                </span>
            </div>

            <div class="flex items-center space-x-1.5">
                <button id="btnSyncCloud" onclick="syncWithCloud()" class="p-2 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition" title="從 Google Sheet 同步">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-slate-300 hover:text-amber-500 dark:hover:text-amber-400 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition" title="切換日夜模式">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="openSettingsModal()" class="p-2 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition" title="預算、卡片與系統設定">
                    <i class="fa-solid fa-sliders"></i>
                </button>
                <button onclick="openBackupModal()" class="p-2 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition" title="資料備份與還原">
                    <i class="fa-solid fa-database"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區：支援模組可拖曳容器 -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 年月快速切換條 -->
        <div class="flex items-center justify-between bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700 transition-colors">
            <button onclick="changeMonth(-1)" class="p-2 w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="text-center">
                <h2 id="currentMonthYearText" class="text-lg font-bold text-slate-800 dark:text-slate-100">載入中...</h2>
                <span id="currentLunarSummary" class="text-[11px] text-slate-400 dark:text-slate-400">農曆讀取中</span>
            </div>
            <button onclick="changeMonth(1)" class="p-2 w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200 transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- 可自訂排序模組容器 -->
        <div id="sortableModulesContainer" class="space-y-6">

            <!-- 模組 1: 快捷排程膠囊區 (Quick Add Event Module) -->
            <section data-id="module-quick-event" class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 transition-colors">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="drag-handle cursor-grab text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </span>
                        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <i class="fa-regular fa-calendar-plus text-blue-500"></i> 快速建立日程
                        </h3>
                    </div>
                    <span class="text-xs text-slate-400">按 Enter 即刻儲存</span>
                </div>

                <!-- 常用快捷膠囊 (保留 💋赤口 與自訂功能) -->
                <div class="mb-3 pb-2.5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
                    <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar text-xs py-1" id="quickChipsContainer">
                        <span class="text-[11px] text-slate-400 whitespace-nowrap mr-1"><i class="fa-solid fa-bolt text-amber-500"></i> 常用:</span>
                        <button onclick="fillQuickPreset('開會', '10:00')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">💼 開會 10:00</button>
                        <button onclick="fillQuickPreset('健身 / 運動', '19:00')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">🏃 運動 19:00</button>
                        <button onclick="fillQuickPreset('睇醫生 / 覆診', '14:30')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">🏥 睇醫生 14:30</button>
                        <button onclick="fillQuickPreset('買餸 / 日用品', '18:30')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">🛒 買餸 18:30</button>
                        <button onclick="fillQuickPreset('聚餐 / 約會', '19:30')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">🍽️ 聚餐 19:30</button>
                        <button onclick="fillQuickPreset('赤口', '09:00')" class="px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-300 border border-rose-200/60 dark:border-rose-800/60 font-medium transition whitespace-nowrap">💋 赤口 09:00</button>
                    </div>
                    <button onclick="customizePresets()" class="ml-2 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="自訂快捷按鈕">
                        <i class="fa-solid fa-gear text-xs"></i>
                    </button>
                </div>

                <form id="homeQuickEventForm" onsubmit="handleHomeQuickAddEvent(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <div class="sm:col-span-3">
                        <input type="date" id="homeEventDate" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="sm:col-span-2">
                        <input type="time" id="homeEventTime" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="sm:col-span-5">
                        <input type="text" id="homeEventTitle" placeholder="事項名稱 (例如: 尖沙咀聚會)" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="sm:col-span-2">
                        <input type="text" id="homeEventLocation" placeholder="地點(選填)" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </form>
            </section>

            <!-- 模組 2: 現代整合式日曆 (Calendar Module) -->
            <section data-id="module-calendar" class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 transition-colors">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="drag-handle cursor-grab text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </span>
                        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <i class="fa-regular fa-calendar text-indigo-500"></i> 月曆視圖
                        </h3>
                    </div>
                    <button onclick="goToToday()" class="text-xs px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 font-medium transition">
                        回到今天
                    </button>
                </div>

                <!-- 星期表頭 -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 dark:text-slate-400 mb-2">
                    <div class="text-rose-500">日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div class="text-blue-500">六</div>
                </div>

                <!-- 42格日曆網格 -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5">
                    <!-- 由 JavaScript 動態完整渲染 (前後月自動補齊) -->
                </div>
            </section>

            <!-- 模組 3: 財務概覽與預算進度條 (Financial Summary Module) -->
            <section data-id="module-financial" class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 transition-colors">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="drag-handle cursor-grab text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </span>
                        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-wallet text-emerald-500"></i> 本月財務概覽
                        </h3>
                    </div>
                    <span id="budgetAlertBadge" class="text-xs px-2 py-0.5 rounded-md font-medium"></span>
                </div>

                <!-- 總預算進度條 -->
                <div class="mb-4 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-100 dark:border-slate-700/60">
                    <div class="flex justify-between items-center text-xs mb-1.5 font-medium">
                        <span class="text-slate-500 dark:text-slate-400">月預算消耗 (<span id="spentAmountText">$0</span> / <span id="totalBudgetText">$0</span>)</span>
                        <span id="budgetPercentText" class="font-bold text-slate-700 dark:text-slate-200">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                        <div id="budgetProgressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 各卡片/賬戶支出與回贈進度 -->
                <div class="mb-3">
                    <h4 class="text-xs font-semibold text-slate-400 dark:text-slate-400 mb-2">卡片/賬戶消費進度 (簽賬上限/回贈門檻)</h4>
                    <div id="accountsSpendingContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <!-- 動態渲染卡片支出進度條 -->
                    </div>
                </div>

                <!-- 分類支出小膠囊 -->
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 dark:text-slate-400 mb-2">分類支出比例</h4>
                    <div id="categorySpendingBadges" class="flex flex-wrap gap-1.5">
                        <!-- 動態渲染分類支出標籤 -->
                    </div>
                </div>
            </section>

            <!-- 模組 4: 待辦與日常清單 (Todo Module) -->
            <section data-id="module-todos" class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 transition-colors">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="drag-handle cursor-grab text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </span>
                        <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-blue-500"></i> 待辦清單
                        </h3>
                    </div>
                    <span id="todoStatsBadge" class="text-xs text-slate-400">0 項進行中</span>
                </div>

                <form onsubmit="handleQuickAddTodo(event)" class="flex gap-2 mb-3">
                    <input type="text" id="quickTodoInput" placeholder="新增待辦事項..." required class="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-medium transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </form>

                <div id="todoListContainer" class="space-y-1.5 max-h-56 overflow-y-auto hide-scrollbar">
                    <!-- 待辦事項動態載入 -->
                </div>
            </section>
        </div>
    </main>

    <!-- ==================== 彈窗 Modal 集中區 ==================== -->

    <!-- 日期點擊詳情 Modal (整合：每日日程 + 每日收支記賬) -->
    <div id="dayDetailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700 transition-all flex flex-col max-h-[90vh]">
            <!-- 彈窗頂部標題 -->
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                <div>
                    <h3 id="modalDateTitle" class="text-base font-bold text-slate-800 dark:text-slate-100">日期</h3>
                    <p id="modalDateLunar" class="text-xs text-slate-400">農曆</p>
                </div>
                <button onclick="closeDayModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-5 flex-1">
                <!-- 1. 當日日程區 -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400 mb-2.5 flex items-center gap-1.5">
                        <i class="fa-regular fa-clock"></i> 當日日程安排
                    </h4>
                    <div id="modalEventsList" class="space-y-1.5 mb-3">
                        <!-- 當日日程列表 -->
                    </div>
                    <form id="modalAddEventForm" onsubmit="handleSaveEvent(event)" class="flex gap-2">
                        <input type="time" id="eventTime" class="w-24 px-2 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                        <input type="text" id="eventTitle" placeholder="事項名稱" required class="flex-1 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                        <input type="text" id="eventLocation" placeholder="地點" class="w-24 px-2 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                        <button type="submit" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-medium transition">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                </div>

                <hr class="border-slate-100 dark:border-slate-700">

                <!-- 2. 當日收支明細區 -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-receipt"></i> 當日收支記錄
                    </h4>
                    <div id="modalEntriesList" class="space-y-1.5 mb-3">
                        <!-- 當日收支明細動態載入 -->
                    </div>

                    <!-- 記賬表單 (收支分類解耦) -->
                    <form id="modalAddEntryForm" onsubmit="handleSaveEntry(event)" class="space-y-2.5 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200/60 dark:border-slate-700/60">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="flex rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 p-0.5 bg-white dark:bg-slate-800">

                            </div>
                            <input type="number" step="0.01" id="entryAmount" placeholder="金額 (HKD)" required class="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <!-- 分類選單由 JavaScript 依據收/支即時切換 -->
                            <select id="entryCategory" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100"></select>
                            <select id="entryAccount" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100"></select>

                        <div class="flex gap-2">
                            <input type="text" id="entryTitle" placeholder="備註描述 (如: 午餐、超市、薪水)" class="flex-1 px-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <button type="submit" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium transition flex items-center gap-1">

    <!-- 設定 Modal (卡片上限、自訂預算、GAS Web App 網址) -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm hidden">

            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">

                    <input type="number" id="settingMonthlyBudget" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500">

                    <p class="text-[10px] text-slate-400 mt-1">填寫此處可啟用雙向雲端備份及 Gmail 香港 4 大支付解析同步。</p>

    <!-- 備份與還原 Modal (JSON Import / Export) -->
    <div id="backupModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-700 transition-all">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-database text-purple-600 dark:text-purple-400"></i> 資料備份與還原
                </h3>
                <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 space-y-4">
                <div class="p-3 bg-blue-50 dark:bg-blue-950/40 rounded-xl border border-blue-100 dark:border-blue-900/50 text-xs text-blue-700 dark:text-blue-300">
                    <i class="fa-solid fa-circle-info mr-1"></i> 備份檔將包含您所有的日程、記賬明細、待辦事項、特色膠囊設定與卡片預算配置。
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportBackupData()" class="flex flex-col items-center justify-center p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition group">
                        <i class="fa-solid fa-file-export text-2xl text-blue-600 dark:text-blue-400 mb-2 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">匯出 JSON 備份</span>
                        <span class="text-[10px] text-slate-400 mt-0.5">下載至本機儲存</span>
                    </button>

                    <label class="flex flex-col items-center justify-center p-4 rounded-xl border border-dashed border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition cursor-pointer group">
                        <i class="fa-solid fa-file-import text-2xl text-purple-600 dark:text-purple-400 mb-2 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">匯入 JSON 備份</span>
                        <span class="text-[10px] text-slate-400 mt-0.5">還原完整資料庫</span>

                    </label>

    <!-- ==================== JavaScript 核心邏輯 ==================== -->
    <script>
        // 系統常數與儲存鍵
        const STORAGE_KEY_EVENTS = 'my_cal_events';
        const STORAGE_KEY_FINANCE = 'my_cal_finance';
        const STORAGE_KEY_TODOS = 'my_cal_todos';
        const STORAGE_KEY_CONFIG = 'my_cal_config';
        const STORAGE_KEY_GAS_URL = 'my_cal_gas_url';
        const STORAGE_KEY_LAYOUT = 'my_cal_layout_order';
        const STORAGE_KEY_THEME = 'my_cal_theme';
        const STORAGE_KEY_CHIPS = 'my_cal_presets_chips';
        const STORAGE_KEY_APP_NAME = 'my_cal_app_name';

        // 預設快捷膠囊 (100% 完整保留 💋赤口)
        const DEFAULT_PRESET_CHIPS = [
            { title: '開會', time: '10:00', icon: '💼' },
            { title: '健身 / 運動', time: '19:00', icon: '🏃' },
            { title: '睇醫生 / 覆診', time: '14:30', icon: '🏥' },
            { title: '買餸 / 日用品', time: '18:30', icon: '🛒' },
            { title: '聚餐 / 約會', time: '19:30', icon: '🍽️' },
            { title: '赤口', time: '09:00', icon: '💋', isSpecial: true }
        ];

        // 預設收支分類
        const DEFAULT_EXPENSE_CATEGORIES = ['餐飲社交', '交通出行', '購物開支', '飛行里程', '日常開支', '娛樂休閒', '醫療健康', '其他支出'];
        const DEFAULT_INCOME_CATEGORIES = ['薪金收入', '轉賬存入', '投資收益', '獎金回贈', '兼職副業', '其他收入'];

        // 預設財務設定
        const DEFAULT_CONFIG = {
            monthlyBudget: 15000,
            accounts: [
                { name: '現金', limit: 0 },
                { name: 'PayMe', limit: 3000 },
                { name: 'MMpower', limit: 5000 },
                { name: 'EveryMile', limit: 8000 },
                { name: '國泰Mastercard', limit: 10000 }
            ]
        };

        // 核心狀態變數
        let currentDate = new Date();
        let activeModalDateStr = '';
        let currentEntryType = 'expense'; // 'expense' 或 'income'

        let eventsData = [];
        let financialData = [];
        let todosData = [];
        let financialConfig = DEFAULT_CONFIG;
        let presetChips = DEFAULT_PRESET_CHIPS;

        // 農曆簡易轉換對應表 (節氣/香港公眾假期簡要對應)
        const HK_HOLIDAYS_FIXED = {
            '01-01': '元旦',
            '05-01': '勞動節',
            '07-01': '特區特區成立紀念日',
            '10-01': '國慶日',
            '12-25': '聖誕節',
            '12-26': '節禮日'
        };

        // 時區安全封裝函式 (解決 UTC+8 凌晨跨日被截斷問題)
        function getLocalDateStr(date) {
            const d = date || new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // ==================== 初始化流程 ====================
        window.addEventListener('DOMContentLoaded', () => {
            loadAllData();
            initTheme();
            initAppName();
            renderPresetChipsUI();
            initSortableLayout();
            renderCalendar();
            renderFinancialSummary();
            renderTodos();
            
            // 預設填入首頁快速排程日期為今天
            document.getElementById('homeEventDate').value = getLocalDateStr(new Date());
        });

        // 讀取 LocalStorage 數據
        function loadAllData() {
            try {
                eventsData = JSON.parse(localStorage.getItem(STORAGE_KEY_EVENTS)) || [];
                financialData = JSON.parse(localStorage.getItem(STORAGE_KEY_FINANCE)) || [];
                todosData = JSON.parse(localStorage.getItem(STORAGE_KEY_TODOS)) || [];
                
                const savedConfig = localStorage.getItem(STORAGE_KEY_CONFIG);
                financialConfig = savedConfig ? JSON.parse(savedConfig) : DEFAULT_CONFIG;

                const savedChips = localStorage.getItem(STORAGE_KEY_CHIPS);
                presetChips = savedChips ? JSON.parse(savedChips) : DEFAULT_PRESET_CHIPS;
            } catch (e) {
                console.error('LocalStorage 讀取異常:', e);
            }
        }

        function saveStoredData() {
            localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(eventsData));
            localStorage.setItem(STORAGE_KEY_FINANCE, JSON.stringify(financialData));
            localStorage.setItem(STORAGE_KEY_TODOS, JSON.stringify(todosData));
        }

        // 主題切換 (日 / 夜間模式)
        function initTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // 自訂 App 名稱
        function initAppName() {
            const name = localStorage.getItem(STORAGE_KEY_APP_NAME) || 'MyLife Hub';
            document.getElementById('appNameText').textContent = name;
        }

        function renameApp() {
            const current = localStorage.getItem(STORAGE_KEY_APP_NAME) || 'MyLife Hub';
            const val = prompt('請輸入您的個人儀表板名稱：', current);
            if (val && val.trim()) {
                localStorage.setItem(STORAGE_KEY_APP_NAME, val.trim());
                document.getElementById('appNameText').textContent = val.trim();
            }
        }

        // 渲染快捷膠囊 UI (包括 💋赤口)
        function renderPresetChipsUI() {
            const container = document.getElementById('quickChipsContainer');
            if (!container) return;

            let html = `<span class="text-[11px] text-slate-400 whitespace-nowrap mr-1"><i class="fa-solid fa-bolt text-amber-500"></i> 常用:</span>`;
            
            presetChips.forEach(chip => {
                if (chip.isSpecial || chip.title.includes('赤口')) {
                    html += `
                        <button type="button" onclick="fillQuickPreset('${chip.title}', '${chip.time || '09:00'}')" class="px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-300 border border-rose-200/60 dark:border-rose-800/60 font-medium transition whitespace-nowrap">
                            ${chip.icon || '💋'} ${chip.title} ${chip.time || ''}
                        </button>
                    `;
                } else {
                    html += `
                        <button type="button" onclick="fillQuickPreset('${chip.title}', '${chip.time || ''}')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 text-slate-600 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-300 font-medium transition whitespace-nowrap">
                            ${chip.icon || ''} ${chip.title} ${chip.time || ''}
                        </button>
                    `;
                }
            });

            container.innerHTML = html;
        }

        // 點擊快捷膠囊自動帶入
        function fillQuickPreset(title, time) {
            const titleInput = document.getElementById('homeEventTitle');
            const timeInput = document.getElementById('homeEventTime');
            if (titleInput) titleInput.value = title;
            if (timeInput && time) timeInput.value = time;
            if (titleInput) titleInput.focus();
        }

        // 自訂快捷膠囊
        function customizePresets() {
            const currentStr = presetChips.map(c => `${c.icon || ''}${c.title}|${c.time || ''}`).join(', ');
            const input = prompt(
                '編輯自訂快捷膠囊 (以逗號分隔，格式: 圖示標題|時間)\n特別保留: 💋赤口|09:00',
                currentStr
            );

            if (input !== null) {
                const parts = input.split(',').map(s => s.trim()).filter(Boolean);
                const newChips = [];
                let hasChikHao = false;

                parts.forEach(p => {
                    const [fullTitle, time] = p.split('|').map(s => s ? s.trim() : '');
                    if (fullTitle) {
                        const isSpecial = fullTitle.includes('赤口');
                        if (isSpecial) hasChikHao = true;
                        newChips.push({
                            title: fullTitle.replace(/^[^\w\s\u4e00-\u9fa5]+/, '').trim() || fullTitle,
                            icon: fullTitle.match(/^[^\w\s\u4e00-\u9fa5]+/)?.[0] || '📌',
                            time: time || '',
                            isSpecial: isSpecial
                        });
                    }
                });

                if (!hasChikHao) {
                    newChips.push({ title: '赤口', time: '09:00', icon: '💋', isSpecial: true });
                }

                presetChips = newChips;
                localStorage.setItem(STORAGE_KEY_CHIPS, JSON.stringify(presetChips));
                renderPresetChipsUI();
            }
        }

        // 模組拖曳排序 (SortableJS)
        function initSortableLayout() {
            const el = document.getElementById('sortableModulesContainer');
            if (!el) return;

            const savedOrder = localStorage.getItem(STORAGE_KEY_LAYOUT);
            if (savedOrder) {
                const orderArr = JSON.parse(savedOrder);
                orderArr.forEach(id => {
                    const child = el.querySelector(`[data-id="${id}"]`);
                    if (child) el.appendChild(child);
                });
            }

            Sortable.create(el, {
                handle: '.drag-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                onEnd: () => {
                    const currentOrder = Array.from(el.children).map(c => c.getAttribute('data-id'));
                    localStorage.setItem(STORAGE_KEY_LAYOUT, JSON.stringify(currentOrder));
                }
            });
        }

        // ==================== 日曆渲染邏輯 ====================
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
            renderFinancialSummary();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
            renderFinancialSummary();
        }

        // 簡易節氣與農曆顯示
        function getLunarText(d) {
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const key = `${m}-${day}`;
            if (HK_HOLIDAYS_FIXED[key]) return HK_HOLIDAYS_FIXED[key];
            return `初${d.getDate() > 10 ? d.getDate() : ' ' + d.getDate()}`;
        }
        // 渲染日曆矩陣 (前後月自動完整補滿 7 欄網格)
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('currentMonthYearText').textContent = `${year}年 ${month + 1}月`;
            document.getElementById('currentLunarSummary').textContent = getLunarText(new Date(year, month, 1));

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 1. 補齊前月格子
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[85px] sm:min-h-[95px] p-1.5 rounded-xl bg-slate-50/50 dark:bg-slate-800/40 text-slate-300 dark:text-slate-600 select-none';
                dayDiv.innerHTML = `<span class="text-xs font-semibold">${prevMonthDays - i}</span>`;
                grid.appendChild(dayDiv);
            }

            // 今天日期字串
            const todayStr = getLocalDateStr(new Date());

            // 2. 當月格子
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateStr = getLocalDateStr(dateObj);
                const isToday = dateStr === todayStr;

                // 篩選當日日程與記賬
                const dayEvents = eventsData.filter(e => (e.date || '').split('T')[0].trim() === dateStr);
                const dayEntries = financialData.filter(e => (e.date || '').split('T')[0].trim() === dateStr);

                // 計算當日總開支
                const dayExpense = dayEntries
                    .filter(e => e.type === 'expense' || e.type === 'expenses')
                    .reduce((sum, item) => sum + Number(item.amount || 0), 0);

                const dayDiv = document.createElement('div');
                dayDiv.onclick = () => openDayModal(dateStr);
                dayDiv.className = `min-h-[85px] sm:min-h-[95px] p-1.5 rounded-xl cursor-pointer transition border flex flex-col justify-between ${
                    isToday 
                        ? 'bg-blue-50/60 dark:bg-blue-950/40 border-blue-400 dark:border-blue-600 shadow-sm' 
                        : 'bg-white dark:bg-slate-800/90 border-slate-100 dark:border-slate-700/80 hover:border-slate-300 dark:hover:border-slate-600'
                }`;

                let eventsBadgeHtml = '';
                dayEvents.slice(0, 2).forEach(ev => {
                    const isChik = ev.title.includes('赤口');
                    eventsBadgeHtml += `
                        <div class="text-[10px] px-1 py-0.5 rounded truncate ${
                            isChik 
                                ? 'bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-200 font-bold' 
                                : 'bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-200'
                        }">
                            ${ev.time ? ev.time + ' ' : ''}${ev.title}
                        </div>
                    `;
                });
                if (dayEvents.length > 2) {
                    eventsBadgeHtml += `<div class="text-[9px] text-purple-500 dark:text-purple-400 font-medium pl-0.5">+${dayEvents.length - 2} 更多</div>`;
                }

                dayDiv.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold ${isToday ? 'text-blue-600 dark:text-blue-400' : 'text-slate-700 dark:text-slate-200'}">${day}</span>
                            <span class="text-[9px] text-slate-400 dark:text-slate-400">${getLunarText(dateObj)}</span>
                        </div>
                        <div class="mt-1 space-y-0.5">
                            ${eventsBadgeHtml}
                        </div>
                    </div>
                    ${dayExpense > 0 ? `
                        <div class="text-right mt-1">
                            <span class="text-[10px] font-semibold px-1 py-0.2 rounded bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-300">
                                -$${Math.round(dayExpense)}
                            </span>
                        </div>
                    ` : ''}
                `;

                grid.appendChild(dayDiv);
            }

            // 3. 自動補滿月末格子至 7 的整數倍 (防止排版歪斜)
            const totalCellsRendered = firstDayIndex + daysInMonth;
            const remainingCells = (7 - (totalCellsRendered % 7)) % 7;
            for (let i = 1; i <= remainingCells; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[85px] sm:min-h-[95px] p-1.5 rounded-xl bg-slate-50/50 dark:bg-slate-800/40 text-slate-300 dark:text-slate-600 select-none';
                dayDiv.innerHTML = `<span class="text-xs font-semibold">${i}</span>`;
                grid.appendChild(dayDiv);
            }
        }

        // ==================== 財務概覽計算 ====================
        function renderFinancialSummary() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // 篩選當月記賬
            const currentMonthEntries = financialData.filter(item => {
                if (!item.date) return false;
                const d = new Date(item.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });

            // 計算支出與分類統計
            let totalExpense = 0;
            const categorySums = {};
            const accountSums = {};

            currentMonthEntries.forEach(entry => {
                const amt = Number(entry.amount || 0);
                const isExpense = entry.type === 'expense' || entry.type === 'expenses';

                if (isExpense) {
                    totalExpense += amt;
                    categorySums[entry.category] = (categorySums[entry.category] || 0) + amt;
                    accountSums[entry.account] = (accountSums[entry.account] || 0) + amt;
                }
            });

            const budget = financialConfig.monthlyBudget || 15000;
            const percent = Math.min(Math.round((totalExpense / budget) * 100), 100);

            // 更新總進度
            document.getElementById('spentAmountText').textContent = `$${totalExpense.toLocaleString()}`;
            document.getElementById('totalBudgetText').textContent = `$${budget.toLocaleString()}`;
            document.getElementById('budgetPercentText').textContent = `${percent}%`;

            const progressBar = document.getElementById('budgetProgressBar');
            progressBar.style.width = `${percent}%`;

            // 進度條色彩級距警示
            const badge = document.getElementById('budgetAlertBadge');
            if (percent >= 100) {
                progressBar.className = 'bg-rose-600 h-full rounded-full transition-all duration-300';
                badge.className = 'text-xs px-2 py-0.5 rounded-md font-semibold bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-200';
                badge.textContent = '已超支！';
            } else if (percent >= 80) {
                progressBar.className = 'bg-amber-500 h-full rounded-full transition-all duration-300';
                badge.className = 'text-xs px-2 py-0.5 rounded-md font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-200';
                badge.textContent = '預算接近上限';
            } else {
                progressBar.className = 'bg-emerald-500 h-full rounded-full transition-all duration-300';
                badge.className = 'text-xs px-2 py-0.5 rounded-md font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-200';
                badge.textContent = '預算健康';
            }

            // 卡片支出進度條渲染
            const accountsContainer = document.getElementById('accountsSpendingContainer');
            accountsContainer.innerHTML = '';

            const configuredAccounts = financialConfig.accounts || [];
            configuredAccounts.forEach(acc => {
                const spent = accountSums[acc.name] || 0;
                const limit = acc.limit || 0;
                const accPercent = limit > 0 ? Math.min(Math.round((spent / limit) * 100), 100) : 0;

                const cardDiv = document.createElement('div');
                cardDiv.className = 'p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-100 dark:border-slate-700/60';
                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center text-xs mb-1 font-medium">
                        <span class="text-slate-700 dark:text-slate-200">${acc.name}</span>
                        <span class="text-slate-500 dark:text-slate-400">$${spent.toLocaleString()} ${limit > 0 ? `/ $${limit.toLocaleString()}` : ''}</span>
                    </div>
                    ${limit > 0 ? `
                        <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full rounded-full ${accPercent >= 100 ? 'bg-rose-500' : 'bg-blue-500'}" style="width: ${accPercent}%"></div>
                        </div>
                    ` : ''}
                `;
                accountsContainer.appendChild(cardDiv);
            });

            // 分類膠囊標籤
            const catBadgesContainer = document.getElementById('categorySpendingBadges');
            catBadgesContainer.innerHTML = '';
            Object.entries(categorySums).forEach(([cat, amt]) => {
                const span = document.createElement('span');
                span.className = 'text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium';
                span.textContent = `${cat}: $${amt.toLocaleString()}`;
                catBadgesContainer.appendChild(span);
            });
        }

                const dayIndexes = [];

        // ==================== Google Apps Script 雲端同步 ====================
        async function syncWithCloud() {
            const gasUrl = localStorage.getItem(STORAGE_KEY_GAS_URL);
            if (!gasUrl) {
                alert('請先點選右上角齒輪設定，填寫 Google Web App API 網址！');
                return openSettingsModal();
            }

            if (!confirm('確認要與 Google Sheet 進行同步並合併雲端交易記錄嗎？')) return;

            const icon = document.getElementById('cloudSyncIcon');
            const text = document.getElementById('cloudSyncText');
            icon.className = 'fa-solid fa-rotate fa-spin text-blue-500';
            text.textContent = '同步中...';

            try {
                const res = await fetch(gasUrl);
                const cloudRows = await res.json();

                if (Array.isArray(cloudRows)) {
                    let newCount = 0;
                    cloudRows.forEach(row => {
                        const exists = financialData.some(local => local.id === row.id);
                        if (!exists && row.amount) {
                            financialData.push({
                                id: row.id || ('txn_' + Date.now()),
                                date: row.date || getLocalDateStr(new Date()),
                                type: (row.type === 'incomes' || row.type === 'income') ? 'income' : 'expense',
                                amount: Number(row.amount),
                                category: row.category || '日常開支',
                                account: row.account || '現金',
                                title: row.title || '雲端同步項目'
                            });
                            newCount++;
                        }
                    });

                    saveStoredData();
                    renderCalendar();
                    renderFinancialSummary();

                    icon.className = 'fa-solid fa-cloud text-emerald-500';
                    text.textContent = '已同步';
                    alert(`雲端同步成功！已成功合併 ${newCount} 筆新交易明細。`);
                } else {
                    throw new Error('回傳資料格式不符合預期');
                }
            } catch (err) {
                console.error('GAS 同步失敗:', err);
                icon.className = 'fa-solid fa-triangle-exclamation text-rose-500';
                text.textContent = '失敗';
                alert('同步失敗，請檢查 API 網址是否正確授權給「所有人 (Anyone)」存取。');
            }
        }

        function exportBackupData() {
            const fullBackup = {
                version: '2.0',
                exportDate: new Date().toISOString(),
                appName: localStorage.getItem(STORAGE_KEY_APP_NAME) || 'MyLife Hub',
                events: eventsData,
                financialData: financialData,
                todos: todosData,
                config: financialConfig,
                presetChips: presetChips,
                layoutOrder: localStorage.getItem(STORAGE_KEY_LAYOUT)
            };

            const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MyLife_Backup_${getLocalDateStr(new Date())}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('backupFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed.events) eventsData = parsed.events;
                    if (parsed.financialData) financialData = parsed.financialData;
                    if (parsed.todos) todosData = parsed.todos;
                    if (parsed.config) financialConfig = parsed.config;
                    if (parsed.presetChips) {
                        presetChips = parsed.presetChips;
                        localStorage.setItem(STORAGE_KEY_CHIPS, JSON.stringify(presetChips));
                        renderPresetChipsUI();
                    }
                    if (parsed.appName) {
                        localStorage.setItem(STORAGE_KEY_APP_NAME, parsed.appName);
                        initAppName();
                    }
                    if (parsed.layoutOrder) localStorage.setItem(STORAGE_KEY_LAYOUT, parsed.layoutOrder);

                    saveStoredData();
                    localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(financialConfig));
                    initSortableLayout();
                    renderCalendar();
                    renderFinancialSummary();
                    closeBackupModal();
                    alert('全系統資料還原成功！');
                } catch (err) {
                    alert('讀取失敗：' + err.message);
                }
            };
            reader.readAsText(file);
        });

        // ==========================================
        // 雲端同步通用函式 (支援日程與記賬寫入 Google Sheet)
        // ==========================================
        async function syncToGAS(payload) {
            const gasUrl = localStorage.getItem(STORAGE_KEY_GAS_URL) || "";
            if (!gasUrl) return; // 未設定 GAS 網址時靜默跳過

            try {
                const res = await fetch(gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                console.log('雲端同步成功:', result);
                return result;
            } catch (err) {
                console.error('雲端同步失敗:', err);
            }
        }
    </script>
</body>
</html>
