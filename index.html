<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="pageTitle">智能財務日曆</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0f172a',
            cardDark: '#1e293b',
            borderDark: '#334155',
            accent: '#38bdf8',
            expense: '#f43f5e',
            income: '#10b981',
            event: '#8b5cf6'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes slideDown {
      0% { transform: translate(-50%, -100%); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }
    .toast-anim {
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen font-sans antialiased pb-20">

  <!-- Toast 提示組件 -->
  <div id="toastNotification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden">
    <div id="toastContent" class="bg-cardDark/95 border border-accent/40 text-slate-100 px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3 text-sm font-medium">
      <span id="toastIcon">⚡</span>
      <span id="toastMsg">操作成功</span>
    </div>
  </div>

  <!-- 頂部導航欄 -->
  <header class="sticky top-0 z-40 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📅</span>
        <h1 id="appHeaderTitle" class="text-lg font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
          智能財務日曆
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="syncWithCloud()" id="cloudSyncBtn" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800/80 rounded-xl transition" title="雲端同步">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button onclick="openSettingsModal()" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800/80 rounded-xl transition" title="系統設定">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">

    <!-- 頂部智慧自然語言輸入框（支援單筆記賬、批次多日期） -->
    <div class="bg-cardDark border border-borderDark rounded-2xl p-3 shadow-lg">
      <form onsubmit="handleSmartSubmit(event)" class="flex gap-2">
        <input 
          id="smartInput" 
          type="text" 
          placeholder="支援記賬如「美心 58 信用卡」，或批次日程如「(12，16，17，20，22，25，29 Sep， 1 Oct注意)」" 
          class="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500"
        />
        <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition">
          送出
        </button>
      </form>
    </div>

    <!-- 財務概覽卡片 -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-cardDark border border-borderDark rounded-2xl p-3.5">
        <div class="text-xs text-slate-400 mb-1">本月累計開支</div>
        <div id="summaryExpense" class="text-lg sm:text-xl font-black text-rose-400">HK$ 0</div>
      </div>
      <div class="bg-cardDark border border-borderDark rounded-2xl p-3.5">
        <div class="text-xs text-slate-400 mb-1">本月累計收入</div>
        <div id="summaryIncome" class="text-lg sm:text-xl font-black text-emerald-400">HK$ 0</div>
      </div>
      <div class="bg-cardDark border border-borderDark rounded-2xl p-3.5">
        <div class="text-xs text-slate-400 mb-1">本月結餘</div>
        <div id="summaryBalance" class="text-lg sm:text-xl font-black text-sky-400">HK$ 0</div>
      </div>
    </div>

    <!-- 日曆主卡片 -->
    <div class="bg-cardDark border border-borderDark rounded-2xl p-4 shadow-xl">
      <!-- 月份導航 -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <h2 id="calendarMonthYear" class="text-base sm:text-lg font-bold text-slate-100"></h2>
          <button onclick="goToToday()" class="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">今天</button>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- 星期欄 -->
      <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>

      <!-- 日曆網格 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- 選中日期的明細列表 -->
    <div class="bg-cardDark border border-borderDark rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="text-base font-bold text-slate-200" id="selectedDateTitle">今日明細</span>
          <span id="selectedDateSummary" class="text-xs text-slate-400"></span>
        </div>
        <button onclick="openManualAddModal()" class="text-xs font-medium px-3 py-1.5 bg-sky-500/10 text-sky-400 border border-sky-500/30 rounded-lg hover:bg-sky-500/20 transition">
          + 手動記賬
        </button>
      </div>
      <div id="dayTransactionsList" class="space-y-2">
        <!-- JS 動態渲染當日項目 -->
      </div>
    </div>

  </main>

  <!-- 手動新增彈窗 -->
  <div id="manualModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-cardDark border border-borderDark rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <h3 class="text-base font-bold text-slate-100">新增明細</h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-400 mb-1">日期</label>
          <input type="date" id="manualDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">類型</label>
          <select id="manualType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
            <option value="支出">支出</option>
            <option value="收入">收入</option>
            <option value="日程">日程 / 提醒</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">內容 / 商戶</label>
          <input type="text" id="manualNote" placeholder="例如：午餐 / 注意言行" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
        </div>
        <div id="amountFieldWrapper">
          <label class="block text-xs text-slate-400 mb-1">金額 (HKD)</label>
          <input type="number" step="0.1" id="manualAmount" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">賬戶 / 標籤</label>
          <input type="text" id="manualAccount" placeholder="例如：MMpower / EveryMile" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeManualModal()" class="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm hover:bg-slate-700 transition">取消</button>
        <button onclick="saveManualEntry()" class="flex-1 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold text-sm hover:bg-sky-400 transition">儲存</button>
      </div>
    </div>
  </div>

  <!-- 系統設定彈窗 -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-cardDark border border-borderDark rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-slate-100">系統與雲端設定</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <div class="space-y-3 text-sm max-h-[70vh] overflow-y-auto pr-1">
        <div>
          <label class="block text-xs text-slate-400 mb-1">自定義日曆名稱</label>
          <input type="text" id="settingAppTitle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100" placeholder="智能財務日曆">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Google Apps Script Web App URL (雲端 API)</label>
          <input type="url" id="settingCloudUrl" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 text-xs" placeholder="https://script.google.com/macros/s/.../exec">
          <p class="text-[11px] text-slate-500 mt-1">若填寫，打開日曆時將自動從 Google Sheet 同步，並雙向即時備份。</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">快捷記賬 URL 格式示例（供 Shortcut 調用）</label>
          <div class="p-2.5 bg-slate-900/90 rounded-xl text-[11px] font-mono text-sky-300 break-all select-all">
            <span id="shortcutUrlPreview"></span>?q=美心+58+信用卡
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm hover:bg-slate-700 transition">取消</button>
        <button onclick="saveSettings()" class="flex-1 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold text-sm hover:bg-sky-400 transition">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 資料結構與狀態初始化
    // =========================================================
    let appData = [];
    let config = {
      appTitle: "智能財務日曆",
      cloudUrl: ""
    };

    let currentDate = new Date(); // 日曆顯示中的年/月
    let selectedDateStr = formatDate(new Date()); // 當前選取的日期 (YYYY-MM-DD)

    document.addEventListener("DOMContentLoaded", () => {
      loadLocalConfig();
      loadLocalData();
      applyAppTitle();
      renderCalendar();
      renderSelectedDayList();
      checkAndHandleShortcut();
      
      // 如果配置了雲端 API，背景自動拉取同步
      if (config.cloudUrl) {
        syncWithCloud(true);
      }

      document.getElementById('shortcutUrlPreview').innerText = window.location.origin + window.location.pathname;
    });

    // =========================================================
    // LocalStorage 與配置管理
    // =========================================================
    function loadLocalConfig() {
      const saved = localStorage.getItem('my_cal_financial_config');
      if (saved) {
        try { config = { ...config, ...JSON.parse(saved) }; } catch(e) {}
      }
    }

    function saveLocalConfig() {
      localStorage.setItem('my_cal_financial_config', JSON.stringify(config));
    }

    function loadLocalData() {
      const saved = localStorage.getItem('my_cal_data');
      if (saved) {
        try { appData = JSON.parse(saved); } catch(e) { appData = []; }
      }
    }

    function saveLocalData() {
      localStorage.setItem('my_cal_data', JSON.stringify(appData));
    }

    function applyAppTitle() {
      const title = config.appTitle || "智能財務日曆";
      document.getElementById('appHeaderTitle').innerText = title;
      document.getElementById('pageTitle').innerText = title;
    }

    // =========================================================
    // 批次多日期與智慧自然語言解析引擎
    // =========================================================
    function handleSmartSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('smartInput');
      const val = input.value.trim();
      if (!val) return;
      executeSmartAdd(val);
      input.value = '';
    }

    function executeSmartAdd(rawText) {
      if (!rawText) return;

      // 1. 優先檢測是否為「批次多日期共同事項」
      // 例如：(12，16，17，20，22，25，29 Sep， 1 Oct注意)
      const batch = parseBatchDates(rawText);
      if (batch && batch.dates.length > 0) {
        batch.dates.forEach(dStr => {
          const newEvent = {
            id: 'batch_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            date: dStr,
            type: '日程',
            category: '提醒',
            amount: 0,
            note: batch.title,
            account: '日程'
          };
          appData.push(newEvent);
        });

        saveLocalData();
        renderCalendar();
        renderSelectedDayList();
        showToast(`⚡ 已批次在 ${batch.dates.length} 個日子加入：「${batch.title}」`);
        if (config.cloudUrl) syncLocalToCloud();
        return;
      }

      // 2. 單筆自然語言解析 (支出 / 收入 / 日程)
      executeSingleAdd(rawText);
    }

    // 核心：多日期解析器
    function parseBatchDates(text) {
      // 移除可能的外層括號
      let clean = text.replace(/^[（(]\s*/, '').replace(/\s*[）)]$/, '').trim();
      
      // 抓出結尾的事項文字（如「注意」、「謹言慎行」等）
      let title = "注意";
      let datePart = clean;

      // 匹配結尾非純日期的詞句
      const titleMatch = clean.match(/[\u4e00-\u9fa5\w\s]+$/);
      if (titleMatch) {
        const cand = titleMatch[0].trim();
        // 排除單純是月份英文的情況 (如 Sep, Oct)
        if (!/^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)$/i.test(cand)) {
          title = cand;
          datePart = clean.substring(0, clean.lastIndexOf(cand)).trim();
        }
      }

      const currentYear = new Date().getFullYear();
      const monthMap = {
        'jan': 1, 'feb': 2, 'mar': 3, 'apr': 4, 'may': 5, 'jun': 6,
        'jul': 7, 'aug': 8, 'sep': 9, 'sept': 9, 'oct': 10, 'nov': 11, 'dec': 12,
        '1月': 1, '2月': 2, '3月': 3, '4月': 4, '5月': 5, '6月': 6,
        '7月': 7, '8月': 8, '9月': 9, '10月': 10, '11月': 11, '12月': 12
      };

      // 按照逗號、分號切分
      const segments = datePart.split(/[,，;；]/).map(s => s.trim()).filter(Boolean);
      if (segments.length === 0) return null;

      // 逆向掃描：後方的月份資訊賦予前面的日子
      let currentMonth = new Date().getMonth() + 1;
      const parsedItems = [];

      for (let i = segments.length - 1; i >= 0; i--) {
        const seg = segments[i];
        
        // 尋找此段是否帶有月份
        for (const mKey in monthMap) {
          if (new RegExp(mKey, 'i').test(seg)) {
            currentMonth = monthMap[mKey];
            break;
          }
        }

        // 提取日 (數字)
        const dMatch = seg.match(/(\d{1,2})/);
        if (dMatch) {
          parsedItems.unshift({
            year: currentYear,
            month: currentMonth,
            day: parseInt(dMatch[1], 10)
          });
        }
      }

      if (parsedItems.length === 0) return null;

      const targetDates = parsedItems.map(item => {
        const mm = String(item.month).padStart(2, '0');
        const dd = String(item.day).padStart(2, '0');
        return `${item.year}-${mm}-${dd}`;
      });

      return {
        dates: targetDates,
        title: title
      };
    }

    // 單筆自然語言解析器
    function executeSingleAdd(str) {
      let amount = 0;
      let type = "支出";
      let note = str;
      let account = "信用卡";
      let date = selectedDateStr;

      // 提取金額
      const amtMatch = str.match(/(\d+(\.\d{1,2})?)/);
      if (amtMatch) {
        amount = parseFloat(amtMatch[1]);
        note = str.replace(amtMatch[0], '').trim();
      } else {
        // 沒有金額則視為日程
        type = "日程";
        account = "日程";
      }

      // 判斷收入/支出
      if (/收|人工|薪水|出糧|deposit|income/i.test(note)) {
        type = "收入";
      }

      // 智能猜測賬戶
      if (/mmpower/i.test(str)) account = "MMpower";
      else if (/國泰|cathay/i.test(str)) account = "國泰Mastercard";
      else if (/everymile/i.test(str)) account = "EveryMile";
      else if (/payme/i.test(str)) account = "PayMe";
      else if (/八達通|octopus/i.test(str)) account = "八達通";
      else if (/現金|cash/i.test(str)) account = "現金";

      const newItem = {
        id: 'tx_' + Date.now(),
        date: date,
        type: type,
        category: type === '支出' ? '日常開銷' : (type === '收入' ? '主動收入' : '提醒'),
        amount: amount,
        note: note || (type === '支出' ? '消費' : '日常項目'),
        account: account
      };

      appData.push(newItem);
      saveLocalData();
      renderCalendar();
      renderSelectedDayList();
      showToast(`⚡ 已成功記錄：${newItem.note} ${amount > 0 ? 'HK$' + amount : ''}`);
      if (config.cloudUrl) syncLocalToCloud();
    }

    // =========================================================
    // Apple Shortcut URL 參數自動接收
    // =========================================================
    function checkAndHandleShortcut() {
      const urlParams = new URLSearchParams(window.location.search);
      const shortcutParam = urlParams.get('q') || urlParams.get('text') || urlParams.get('add');
      
      if (shortcutParam) {
        const decoded = decodeURIComponent(shortcutParam);
        executeSmartAdd(decoded);

        // 清理 URL 參數，避免用戶刷新頁面時重覆記賬
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
      }
    }

    // =========================================================
    // 日曆渲染核心邏輯
    // =========================================================
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
      document.getElementById('calendarMonthYear').innerText = `${year}年 ${monthNames[month]}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      // 當月累計匯總計算
      let mExpense = 0;
      let mIncome = 0;

      // 補上前一個月的尾巴天數
      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const d = prevTotalDays - i;
        const cell = createDayCell(d, true);
        grid.appendChild(cell);
      }

      // 當月天數
      const todayStr = formatDate(new Date());
      for (let day = 1; day <= totalDays; day++) {
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const cellDateStr = `${year}-${mm}-${dd}`;

        // 撈出當日項目
        const dayItems = appData.filter(item => item.date === cellDateStr);
        let hasEvent = false;
        let dayExp = 0;
        let dayInc = 0;

        dayItems.forEach(it => {
          if (it.type === '支出') { dayExp += it.amount; mExpense += it.amount; }
          else if (it.type === '收入') { dayInc += it.amount; mIncome += it.amount; }
          else if (it.type === '日程') { hasEvent = true; }
        });

        const isSelected = cellDateStr === selectedDateStr;
        const isToday = cellDateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = `min-h-[64px] p-1 rounded-xl border flex flex-col justify-between transition cursor-pointer ${
          isSelected 
            ? 'border-sky-500 bg-sky-500/10' 
            : isToday 
              ? 'border-slate-600 bg-slate-800/80' 
              : 'border-slate-800/60 bg-slate-900/40 hover:bg-slate-850'
        }`;

        cell.onclick = () => {
          selectedDateStr = cellDateStr;
          renderCalendar();
          renderSelectedDayList();
        };

        // 頂部日期數字與狀態標籤
        let indicators = '';
        if (hasEvent) indicators += `<span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>`;
        if (dayExp > 0) indicators += `<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>`;
        if (dayInc > 0) indicators += `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>`;

        cell.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold ${isToday ? 'text-sky-400' : 'text-slate-300'}">${day}</span>
            <div class="flex gap-0.5">${indicators}</div>
          </div>
          <div class="text-[10px] truncate space-y-0.5 mt-1">
            ${dayExp > 0 ? `<div class="text-rose-400 font-medium">-$${Math.round(dayExp)}</div>` : ''}
            ${hasEvent ? `<div class="text-indigo-300 font-medium truncate">● 注意</div>` : ''}
          </div>
        `;

        grid.appendChild(cell);
      }

      // 更新概覽金額
      document.getElementById('summaryExpense').innerText = `HK$ ${mExpense.toLocaleString()}`;
      document.getElementById('summaryIncome').innerText = `HK$ ${mIncome.toLocaleString()}`;
      const bal = mIncome - mExpense;
      const balEl = document.getElementById('summaryBalance');
      balEl.innerText = `HK$ ${bal.toLocaleString()}`;
      balEl.className = `text-lg sm:text-xl font-black ${bal >= 0 ? 'text-sky-400' : 'text-rose-400'}`;
    }

    function createDayCell(dayNum, isMuted) {
      const el = document.createElement('div');
      el.className = 'min-h-[64px] p-1 rounded-xl border border-slate-900 bg-slate-950/40 opacity-25 flex flex-col';
      el.innerHTML = `<span class="text-xs text-slate-500 font-semibold">${dayNum}</span>`;
      return el;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      selectedDateStr = formatDate(new Date());
      renderCalendar();
      renderSelectedDayList();
    }

    // =========================================================
    // 選中日明細渲染
    // =========================================================
    function renderSelectedDayList() {
      document.getElementById('selectedDateTitle').innerText = `${selectedDateStr} 明細`;
      const listEl = document.getElementById('dayTransactionsList');
      listEl.innerHTML = '';

      const items = appData.filter(i => i.date === selectedDateStr);
      if (items.length === 0) {
        listEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">當天尚無記賬或日程</div>`;
        document.getElementById('selectedDateSummary').innerText = '';
        return;
      }

      let dExp = 0;
      let dInc = 0;

      items.forEach(it => {
        if (it.type === '支出') dExp += it.amount;
        if (it.type === '收入') dInc += it.amount;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition";

        let color = it.type === '支出' ? 'text-rose-400' : (it.type === '收入' ? 'text-emerald-400' : 'text-indigo-400');
        let sign = it.type === '支出' ? '-' : (it.type === '收入' ? '+' : '');

        row.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-2 h-8 rounded-full ${it.type === '支出' ? 'bg-rose-500' : (it.type === '收入' ? 'bg-emerald-500' : 'bg-indigo-500')}"></div>
            <div>
              <div class="text-xs font-bold text-slate-200">${it.note || it.category}</div>
              <div class="text-[11px] text-slate-500">${it.account || ''} · ${it.type}</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            ${it.type !== '日程' ? `<div class="text-sm font-bold ${color}">${sign}HK$ ${it.amount}</div>` : `<span class="text-xs text-indigo-400 font-medium">提醒</span>`}
            <button onclick="deleteEntry('${it.id}')" class="text-slate-500 hover:text-rose-400 p-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        `;
        listEl.appendChild(row);
      });

      document.getElementById('selectedDateSummary').innerText = `支出: HK$ ${dExp} | 收入: HK$ ${dInc}`;
    }

    function deleteEntry(id) {
      appData = appData.filter(i => i.id !== id);
      saveLocalData();
      renderCalendar();
      renderSelectedDayList();
      showToast("已刪除項目");
    }

    // =========================================================
    // 雲端同步 (Google Sheet API)
    // =========================================================
    async function syncWithCloud(isSilent = false) {
      if (!config.cloudUrl) {
        if (!isSilent) showToast("⚠️ 請先在設定中填寫 Google Sheet API 網址");
        return;
      }

      if (!isSilent) showToast("雲端同步中...", 2000);

      try {
        const res = await fetch(config.cloudUrl);
        const cloudData = await res.json();

        if (Array.isArray(cloudData)) {
          // 合併雲端與本地數據（依 ID 去重）
          const idMap = new Map();
          appData.forEach(item => idMap.set(item.id, item));
          cloudData.forEach(item => idMap.set(item.id, item));

          appData = Array.from(idMap.values());
          saveLocalData();
          renderCalendar();
          renderSelectedDayList();
          if (!isSilent) showToast("⚡ 雲端雙向同步完成！");
        }
      } catch (err) {
        if (!isSilent) showToast("⚠️ 雲端讀取失敗，請檢查網址與權限");
      }
    }

    async function syncLocalToCloud() {
      if (!config.cloudUrl) return;
      // 可以在此觸發將本地最新項目 POST 到 Google Sheet
    }

    // =========================================================
    // UI Modal 與輔助函數
    // =========================================================
    function openManualAddModal() {
      document.getElementById('manualDate').value = selectedDateStr;
      document.getElementById('manualNote').value = '';
      document.getElementById('manualAmount').value = '';
      document.getElementById('manualModal').classList.remove('hidden');
    }

    function closeManualModal() {
      document.getElementById('manualModal').classList.add('hidden');
    }

    function saveManualEntry() {
      const date = document.getElementById('manualDate').value || selectedDateStr;
      const type = document.getElementById('manualType').value;
      const note = document.getElementById('manualNote').value.trim() || '日常項目';
      const amount = parseFloat(document.getElementById('manualAmount').value) || 0;
      const account = document.getElementById('manualAccount').value.trim() || '現金';

      appData.push({
        id: 'tx_' + Date.now(),
        date, type, category: '手動', amount, note, account
      });

      saveLocalData();
      renderCalendar();
      renderSelectedDayList();
      closeManualModal();
      showToast("新增成功");
      if (config.cloudUrl) syncLocalToCloud();
    }

    function openSettingsModal() {
      document.getElementById('settingAppTitle').value = config.appTitle || '';
      document.getElementById('settingCloudUrl').value = config.cloudUrl || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      config.appTitle = document.getElementById('settingAppTitle').value.trim() || '智能財務日曆';
      config.cloudUrl = document.getElementById('settingCloudUrl').value.trim();
      saveLocalConfig();
      applyAppTitle();
      closeSettingsModal();
      showToast("設定已更新");
      if (config.cloudUrl) syncWithCloud();
    }

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      toast.classList.add('toast-anim');
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('toast-anim');
      }, duration);
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
  </script>
</body>
